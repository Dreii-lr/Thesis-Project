[project]
name = "app"
version = "0.1.0"
description = "Thesis Project Backend — Feature-based Monolith FastAPI"
readme = "README.md"
authors = [
    { name = "johnpaulaquino", email = "johnpaul.dev72@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlmodel>=0.0.21",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "firebase-admin>=6.6.0",
    "bcrypt>=4.2.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

